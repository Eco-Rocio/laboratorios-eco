<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071b68">
<title>Combos para emprendedores — Laboratorios Eco</title>
<style>
:root{--navy:#071b68;--blue:#09aee8;--lime:#c9df27;--bg:#f5f8fc;--ink:#15234b;--muted:#667085;--line:#e6ebf2}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:13px 16px;display:flex;align-items:center;gap:12px}
.back{color:var(--navy);text-decoration:none;font-weight:700;font-size:14px}
.title{flex:1;text-align:center;color:var(--navy);font-size:16px;font-weight:800;margin-right:54px}
main{max-width:760px;margin:0 auto;padding:18px 12px 38px}
.intro{text-align:center;padding:8px 8px 18px}
.intro h1{font-size:25px;line-height:1.15;color:var(--navy);margin:0 0 8px}
.intro p{font-size:14px;line-height:1.45;color:var(--muted);margin:0}
.pages{display:grid;gap:14px}
.page{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 16px rgba(7,27,104,.08)}
.footer{text-align:center;padding:22px 10px 8px;color:var(--muted);font-size:12px}
.cta{display:inline-block;margin-top:14px;background:var(--navy);color:#fff;text-decoration:none;padding:11px 16px;border-radius:12px;font-weight:700}
@media(max-width:480px){main{padding-left:7px;padding-right:7px}.pages{gap:9px}.page{border-radius:8px}.title{font-size:15px;margin-right:42px}}
</style>
</head>
<body>
<header>
<a class="back" href="index.html">← Volver</a>
<div class="title">Laboratorios Eco</div>
</header>
<main>
<section class="intro">
<h1>Combos para emprendedores</h1>
<p>Deslizá hacia abajo para ver todas las opciones. No necesitás instalar ninguna aplicación.</p>
</section>
<section class="pages">
<img class="page" src="pages/page-01.webp" alt="Combo para emprendedores — página 1" loading="eager">
<img class="page" src="pages/page-02.webp" alt="Combo para emprendedores — página 2" loading="lazy">
<img class="page" src="pages/page-03.webp" alt="Combo para emprendedores — página 3" loading="lazy">
<img class="page" src="pages/page-04.webp" alt="Combo para emprendedores — página 4" loading="lazy">
<img class="page" src="pages/page-05.webp" alt="Combo para emprendedores — página 5" loading="lazy">
<img class="page" src="pages/page-06.webp" alt="Combo para emprendedores — página 6" loading="lazy">
<img class="page" src="pages/page-07.webp" alt="Combo para emprendedores — página 7" loading="lazy">
<img class="page" src="pages/page-08.webp" alt="Combo para emprendedores — página 8" loading="lazy">
<img class="page" src="pages/page-09.webp" alt="Combo para emprendedores — página 9" loading="lazy">
<img class="page" src="pages/page-10.webp" alt="Combo para emprendedores — página 10" loading="lazy">
<img class="page" src="pages/page-11.webp" alt="Combo para emprendedores — página 11" loading="lazy">
</section>
<div class="footer">Laboratorios Eco · Información comercial<br><a class="cta" href="index.html">Volver al catálogo</a></div>
</main>
</body>
</html>
